name: Release

permissions: {}

on:
  push:
    tags: ['v2.[0-9]+.[0-9]+']

jobs:
  release:
    permissions:
      actions: read
      attestations: write
      artifact-metadata: write
      contents: write
      discussions: write
      id-token: write
    uses: panva/.github/.github/workflows/npm-release.yml@75ad63f5730195dd3e9ec22dbbf29101c99d8501 # v4
    with:
      cleanup_paths: '["build"]'
