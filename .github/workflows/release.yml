name: Release

permissions: {}

on:
  push:
    tags: ['v2.[0-9]+.[0-9]+']

jobs:
  release:
    permissions:
      actions: read
      attestations: write
      artifact-metadata: write
      contents: write
      discussions: write
      id-token: write
    uses: panva/.github/.github/workflows/npm-release.yml@a4736719ab55fdedeee01739c175e01bff32386f # v1
    with:
      cleanup_paths: '["build"]'
